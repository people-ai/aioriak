version: 2.1

base_image: &base_image
  docker:
    - image: 093527149400.dkr.ecr.us-west-2.amazonaws.com/docker-builder:latest

commands:
  install_aws_cli:
    description: Install AWS CLI
    steps:
      - run:
          name: Install AWS CLI
          command: |
            curl https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install

jobs:
  publish:
    <<: *base_image
    steps:
      - checkout
      - run: python3 -m venv venv && . ./venv/bin/activate
      - run: sudo pip install -r requirements-publish.txt
      - run: make build
      - run: make publish-circle

  mypy:
    <<: *base_image
    steps:
      - checkout
      - run: |
          sudo pip install mypy
          mypy --ignore-missing-imports --install-types --non-interactive ${CIRCLE_PROJECT_REPONAME}

  test:
    docker:
      - image: cimg/python:3.9.10
    steps:
      - checkout
      - run: git submodule update --init
      - install_aws_cli
      - setup_remote_docker:
          version: 19.03.13
      - run: |
          mkdir -p reports
          virtualenv --python=python3 venv && . venv/bin/activate
          aws codeartifact login --tool pip --domain people-ai --repository pai-pypi --region us-east-1 --duration 900
          # NOTE: this is needed because of this issue:
          # https://github.com/pypa/setuptools/issues/2849
          # it can be removed when it is resolved
          make start-test-env
      - run: sleep 30
      - run: |
          docker ps
          make start-integration-test
          make stop-test-env
      - store_test_results:
          path: ./reports
      - store_artifacts:
          path: ./reports

  bandit:
    <<: *base_image
    steps:
      - checkout
      - run: |
          python3 -m venv venv && . ./venv/bin/activate
          pip install bandit==1.7.1
          bandit -ll -r ${CIRCLE_PROJECT_REPONAME}

orbs:
  sumologic: circleci/sumologic@1.0.6

workflows:
  build-test:
    jobs:
      - sumologic/workflow-collector
      - test:
          context: staging
      - mypy:
          context: staging
      - bandit:
          context: staging

      - publish:
          context: org-global
          requires:
            - bandit
            - test
            - mypy
          filters:
            branches:
              only:
                - master
